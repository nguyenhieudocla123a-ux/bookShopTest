spring.application.name=myBookShop

# Secret khong nam trong Git. Doc tu bien moi truong hoac file .env (xem .env.example).
spring.config.import=optional:file:.env[.properties],optional:file:myBookShop/.env[.properties]

# =========================
# DATABASE (SQL SERVER)
# =========================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=bookstore;encrypt=false}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# Moi truy cap DB deu nam trong Service, khong de query chay ngam luc tao response.
spring.jpa.open-in-view=false

# =========================
# FLYWAY
# =========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# =========================
# REDIS
# =========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Project dung RedisTemplate, repository cua project deu la JPA nen tat tinh nang nay.
spring.data.redis.repositories.enabled=false

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.expiration-refreshToken=604800000

# =========================
# CORS
# =========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
