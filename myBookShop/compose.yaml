# Chay: docker compose up --build
# Can file .env (xem .env.example). DB_PASSWORD phai du manh theo yeu cau cua SQL Server.
services:
  redis:
    image: 'redis:7.4'
    ports:
      - '6379:6379'

  sqlserver:
    image: 'mcr.microsoft.com/mssql/server:2022-latest'
    environment:
      - 'ACCEPT_EULA=Y'
      - 'MSSQL_PID=Express'
      - 'MSSQL_SA_PASSWORD=${DB_PASSWORD}'
    ports:
      # Doi SQL_PORT trong .env neu may da co SQL Server chay o cong 1433
      - '${SQL_PORT:-1433}:1433'
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12

  # Flyway khong tao duoc database nen can buoc nay chay truoc
  db-init:
    image: 'mcr.microsoft.com/mssql/server:2022-latest'
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - 'SA_PASSWORD=${DB_PASSWORD}'
    entrypoint:
      - /bin/sh
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$SA_PASSWORD" -Q "IF DB_ID('bookstore') IS NULL CREATE DATABASE bookstore"
    restart: 'no'

  app:
    build: .
    depends_on:
      redis:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    environment:
      - 'DB_URL=jdbc:sqlserver://sqlserver:1433;databaseName=bookstore;encrypt=false'
      - 'DB_USERNAME=sa'
      - 'DB_PASSWORD=${DB_PASSWORD}'
      - 'JWT_SECRET=${JWT_SECRET}'
      - 'REDIS_HOST=redis'
    ports:
      - '8080:8080'
